<div class="chat-container">
  <!-- Connection Status -->
  <div class="connection-status" [class.connected]="isConnected" [class.disconnected]="!isConnected">
    <span class="status-indicator"></span>
    {{ isConnected ? 'Connected' : 'Disconnected' }}
  </div>

  <!-- Chat Header -->
  <div class="chat-header">
    <h3>{{ channelName }} ({{ groupName }})</h3>
    <div class="user-info">
      <span>{{ currentUser?.username }}</span>
    </div>
  </div>

  <!-- Messages Container -->
  <div class="messages-container" #messagesContainer>
    <div *ngFor="let message of messages" 
         class="message" 
         [class.own-message]="isOwnMessage(message)"
         [class.system-message]="isSystemMessage(message)">
      
      <div class="message-header" *ngIf="!isSystemMessage(message)">
        <span class="username">{{ message.username }}</span>
        <span class="timestamp">{{ formatTimestamp(message.timestamp) }}</span>
      </div>
      
      <div class="message-content">
        <div *ngIf="message.messageType === 'text'" class="text-message">
          {{ message.message }}
        </div>
        
        <div *ngIf="message.messageType === 'image'" class="image-message">
          <img [src]="message.imageUrl" [alt]="message.message" class="message-image">
          <div *ngIf="message.message" class="image-caption">{{ message.message }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Input -->
  <div class="message-input-container">
    <div class="input-group">
      <input 
        type="text" 
        [(ngModel)]="newMessage" 
        (keypress)="onKeyPress($event)"
        placeholder="Type your message..."
        class="message-input"
        [disabled]="!isConnected">
      
      <button 
        (click)="sendMessage()" 
        [disabled]="!newMessage.trim() || !isConnected"
        class="send-button">
        Send
      </button>
    </div>
  </div>
</div>
