<div class="container">
  <h1>Register</h1>
  <form (ngSubmit)="register()">
    <div class="form-group">
      <label>Username</label>
      <input  
        type="text" 
        class="form-control"
        [(ngModel)]="username" 
        name="username"/>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" 
        class="form-control"
        [(ngModel)]="email" 
        name="email"/>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input 
        type="password" 
        class="form-control"
        [(ngModel)]="password" 
        name="password"/>
    </div>
    

    <button type="submit" class="btn btn-primary" (click)="register()">Register</button>
  </form>

  <div>{{errormsg}} </div>

  <div class="mt-3">
        <p>Already registered?
            <a routerLink="/login" class="btn btn-link">Login</a>
        </p>
    </div>
</div>
