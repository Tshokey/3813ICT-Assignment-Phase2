<div class="container mt-4">
  <h1>Register</h1>
  <form (ngSubmit)="register()">
    <div class="form-group">
      <label>Username</label>
      <input  
        type="text" 
        class="form-control"
        [(ngModel)]="username" 
        name="username"/>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" 
        class="form-control"
        [(ngModel)]="email" 
        name="email"/>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input 
        type="password" 
        class="form-control"
        [(ngModel)]="password" 
        name="password"/>
    </div>
    
     Added profile image upload section 
    <div class="form-group">
      <label>Profile Image (Optional)</label>
      <input 
        type="file" 
        id="profileImageInput"
        accept="image/*" 
        (change)="onFileSelected($event)"
        class="form-control"/>
      <small class="form-text text-muted">Maximum file size: 5MB</small>
      <p *ngIf="uploadMessage" class="text-danger mt-2">{{ uploadMessage }}</p>
    </div>

    <button type="submit" class="btn btn-primary mt-2" (click)="register()">Register</button>
  </form>

  <div>{{errormsg}} </div>

  <div class="mt-3">
        <p>Already registered?
            <a routerLink="/login" class="btn btn-link">Login</a>
        </p>
    </div>
</div>
