<div class="container">
  <header class="channels-header">
    <h1 class="channels-title">Channels</h1>
  </header>

  <div class="channels-content">
    <div *ngIf="user" class="user-info-section">
      <p><strong>Logged in as:</strong> {{user.username}}</p>
      <p><strong>Roles:</strong> {{user.roles.join(', ')}}</p>
    </div>

    <div *ngIf="errormsg" class="alert alert-danger">{{errormsg}}</div>

    <div *ngIf="!selectedChannel">
      <div class="group-selection-section">
        <label><strong>Select Group:</strong></label>
        <select class="form-control mt-2" [(ngModel)]="selectedGroupName">
          <option *ngFor="let g of groups" [value]="g.name">{{g.name}}</option>
        </select>
      </div>

      <div *ngIf="auth.hasRole('GROUP_ADMIN') || auth.hasRole('SUPER_ADMIN')" class="create-channel-section">
        <input [(ngModel)]="channelName" class="form-control" placeholder="Enter channel name" />
        <button class="btn btn-primary mt-2" (click)="createChannel()">Create Channel</button>
      </div>

      <div class="channels-list-section">
        <h3>Channels in Selected Group</h3>
        <div *ngIf="groupAccessErr" class="alert alert-warning">
          {{groupAccessErr}}
        </div>
        <ul class="list-group">
          <ng-container *ngFor="let channel of visibleChannels">
            <li class="list-group-item" *ngIf="channel.groupName === selectedGroupName">
              <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                  <strong>{{channel.name}}</strong>
                  
                  <div class="mt-2">
                    <button *ngIf="user && !channel.members.includes(user!.username)" class="btn btn-sm btn-success" (click)="joinChannel(channel)">Join</button>
                    <button *ngIf="user && channel.members.includes(user!.username)" class="btn btn-sm btn-warning ms-2" (click)="leaveChannel(channel)">Leave</button>
                    <button *ngIf="user && channel.members.includes(user!.username)" class="btn btn-sm btn-primary ms-2" (click)="selectChannel(channel)">Open Chat</button>
                  </div>

                  <div class="mt-3">
                    <button 
                      class="btn btn-sm btn-outline-secondary" 
                      (click)="toggleMembers(channel.name)"
                      *ngIf="channel.members.length > 0">
                      <span *ngIf="!isMembersExpanded(channel.name)">▶ Show Members ({{channel.members.length}})</span>
                      <span *ngIf="isMembersExpanded(channel.name)">▼ Hide Members ({{channel.members.length}})</span>
                    </button>
                    <span *ngIf="channel.members.length === 0"><em>No members yet</em></span>
                  </div>

                  <div *ngIf="isMembersExpanded(channel.name)" class="mt-2 members-section">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <strong>Members:</strong>
                      <button 
                        *ngIf="(auth.hasRole('SUPER_ADMIN') || auth.hasRole('GROUP_ADMIN')) && getSelectedMembers(channel.name).length > 0"
                        class="btn btn-sm btn-danger"
                        (click)="removeSelectedMembers(channel)">
                        Remove Selected ({{getSelectedMembers(channel.name).length}})
                      </button>
                    </div>
                    <ul class="list-unstyled">
                      <li *ngFor="let m of channel.members" class="member-item">
                        <label class="d-flex align-items-center justify-content-between">
                          <div class="d-flex align-items-center">
                            <input 
                              *ngIf="auth.hasRole('SUPER_ADMIN') || auth.hasRole('GROUP_ADMIN')"
                              type="checkbox"
                              [checked]="isMemberSelected(channel.name, m)"
                              (change)="toggleMemberSelection(channel.name, m)"
                              class="me-2">
                            <span>{{m}}</span>
                          </div>
                          <div class="btn-group" *ngIf="auth.hasRole('SUPER_ADMIN') || auth.hasRole('GROUP_ADMIN')">
                            <button class="btn btn-sm btn-outline-danger" (click)="banUser(channel, m); $event.preventDefault()"><small>Ban</small></button>
                            <button class="btn btn-sm btn-outline-warning" (click)="reportUser(channel, m, 'Misconduct'); $event.preventDefault()"><small>Report</small></button>
                          </div>
                        </label>
                      </li>
                    </ul>
                  </div>
                </div>

                <div class="channel-actions">
                  <button 
                    *ngIf="auth.hasRole('SUPER_ADMIN') || auth.hasRole('GROUP_ADMIN')" 
                    class="btn btn-sm btn-danger" 
                    (click)="deleteChannel(channel)">
                    Delete Channel
                  </button>
                </div>
              </div>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>

    <div *ngIf="selectedChannel" class="chat-section">
      <button class="btn btn-secondary mb-3" (click)="closeChat()">← Back to Channels</button>
      <app-chat 
        [channelName]="selectedChannel.name" 
        [groupName]="selectedChannel.groupName">
      </app-chat>
    </div>
  </div>
</div>
