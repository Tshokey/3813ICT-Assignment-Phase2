<div class="container mt-4">
    <h1>Login</h1>

    <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
            type="username" [(ngModel)]="username" 
            id="username" 
            name="username" 
            class="form-control"/>
    </div>

    <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
            type="password" [(ngModel)]="password" 
            id="password" 
            name="password" 
            class="form-control"/>
    </div>

    <div class="form-group">
        <button class="btn btn-primary mt-2" (click)="login()" >Login</button>
    </div>

    <div>{{errormsg}} </div>

    <div class="mt-3">
        <p>Don't have an account?
            <a routerLink="/register" class="btn btn-link">Register here</a>
        </p>
    </div>
</div>
