<div class="admin-container">
  <!-- Added header with title and user count -->
  <div class="admin-header">
    <div>
      <h1 class="admin-title">User Management</h1>
      <p class="admin-subtitle">Manage users, roles, and permissions</p>
    </div>
    <div class="user-count">
      <span class="count-number">{{filteredUsers.length}}</span>
      <span class="count-label">Total Users</span>
    </div>
  </div>

  <!-- Added role filter tabs -->
  <div class="filter-tabs">
    <button 
      class="tab-button" 
      [class.active]="selectedRole === 'all'"
      (click)="setRoleFilter('all')">
      All Users
      <span class="tab-count">{{users.length}}</span>
    </button>
    <button 
      class="tab-button" 
      [class.active]="selectedRole === 'SUPER_ADMIN'"
      (click)="setRoleFilter('SUPER_ADMIN')">
      Super Admins
      <span class="tab-count">{{superAdminCount}}</span>
    </button>
    <button 
      class="tab-button" 
      [class.active]="selectedRole === 'GROUP_ADMIN'"
      (click)="setRoleFilter('GROUP_ADMIN')">
      Group Admins
      <span class="tab-count">{{groupAdminCount}}</span>
    </button>
    <button 
      class="tab-button" 
      [class.active]="selectedRole === 'USER'"
      (click)="setRoleFilter('USER')">
      Users
      <span class="tab-count">{{userCount}}</span>
    </button>
  </div>

  <!-- Added batch action bar -->
  <div class="action-bar" *ngIf="selectedCount > 0">
    <div class="action-bar-left">
      <span class="selected-count">{{selectedCount}} selected</span>
      <button class="action-clear" (click)="selectedUsers.clear(); selectAll = false">Clear</button>
    </div>
    <div class="action-bar-right">
      <button class="action-btn action-promote-group" (click)="batchPromoteToGroupAdmin()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2L10 6L14 6.5L11 9.5L11.5 14L8 12L4.5 14L5 9.5L2 6.5L6 6L8 2Z" fill="currentColor"/>
        </svg>
        Promote to Group Admin
      </button>
      <button class="action-btn action-promote-super" (click)="batchPromoteToSuperAdmin()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1L10.5 5.5L15 6.5L11.5 10L12 15L8 12.5L4 15L4.5 10L1 6.5L5.5 5.5L8 1Z" fill="currentColor"/>
        </svg>
        Promote to Super Admin
      </button>
      <button class="action-btn action-delete" (click)="batchDeleteUsers()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 4H13M5 4V3C5 2.5 5.5 2 6 2H10C10.5 2 11 2.5 11 3V4M6 7V12M10 7V12M4 4H12V13C12 13.5 11.5 14 11 14H5C4.5 14 4 13.5 4 13V4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Delete Users
      </button>
    </div>
  </div>

  <!-- Redesigned table with modern styling -->
  <div class="table-container">
    <table class="users-table">
      <thead>
        <tr>
          <th class="th-checkbox">
            <input 
              type="checkbox" 
              class="checkbox-input"
              [(ngModel)]="selectAll"
              (change)="toggleSelectAll()"
            />
          </th>
          <th class="th-user">User</th>
          <th class="th-roles">Roles</th>
          <th class="th-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of filteredUsers" class="user-row">
          <td class="td-checkbox">
            <input 
              type="checkbox" 
              class="checkbox-input"
              [checked]="isUserSelected(u.username)"
              (change)="toggleUserSelection(u.username)"
              [disabled]="u.username === 'super'"
            />
          </td>
          <td class="td-user">
            <div class="user-info">
              <div class="user-avatar">{{u.username.charAt(0).toUpperCase()}}</div>
              <div class="user-details">
                <div class="user-name">{{u.username}}</div>
                <div class="user-email">{{u.email}}</div>
              </div>
            </div>
          </td>
          <td class="td-roles">
            <div class="roles-container">
              <span 
                *ngFor="let role of u.roles" 
                class="role-badge"
                [ngClass]="getRoleBadgeClass(role)">
                {{role.replace('_', ' ')}}
              </span>
            </div>
          </td>
          <td class="td-actions">
            <button 
              *ngIf="canRemove(u)" 
              class="btn-delete"
              (click)="removeUser(u)"
              title="Delete user">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 4H13M5 4V3C5 2.5 5.5 2 6 2H10C10.5 2 11 2.5 11 3V4M6 7V12M10 7V12M4 4H12V13C12 13.5 11.5 14 11 14H5C4.5 14 4 13.5 4 13V4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
